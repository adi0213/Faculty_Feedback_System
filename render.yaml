# Render deployment configuration
# See https://render.com/docs/yaml-spec

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: edupulse-backend
    runtime: python
    rootDir: edupulse-backend-v2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edupulse-db
          property: connectionString
      - key: LLM_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: K_ANONYMITY_THRESHOLD
        value: "5"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
    healthCheckPath: /health

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: edupulse-frontend
    runtime: static
    rootDir: edupulse-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edupulse-backend.onrender.com/api/v2
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Database ──────────────────────────────────────────────────────────────────
databases:
  - name: edupulse-db
    databaseName: edupulse_v2
    user: edupulse
    plan: free
