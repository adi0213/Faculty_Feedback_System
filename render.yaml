# render.yaml — EduPulse AI Full-Stack Deployment
# Docs: https://render.com/docs/yaml-spec

services:
  # ── Backend API (Docker) ─────────────────────────────────────────────────────
  - type: web
    name: edupulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile        # Root-level Dockerfile
    dockerContext: .                     # Repo root as build context
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edupulse-db
          property: connectionString
      - key: LLM_ENABLED
        value: "false"                   # Set to true once you add your OpenAI key
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false                      # Set manually in Render dashboard
      - key: K_ANONYMITY_THRESHOLD
        value: "5"
      - key: REDIS_URL
        value: redis://localhost:6379/0  # Optional — rate limiting falls back gracefully
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: APP_ALLOWED_ORIGINS
        value: https://edupulse-frontend.onrender.com,http://localhost:5173
      - key: SCORING_ALPHA
        value: "0.70"
      - key: SCORING_BAYES_K
        value: "8"
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
    healthCheckPath: /health

  # ── Frontend (Static Site) ───────────────────────────────────────────────────
  - type: web
    name: edupulse-frontend
    runtime: static
    buildCommand: cd edupulse-react && npm install && npm run build
    staticPublishPath: ./edupulse-react/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edupulse-backend.onrender.com/api/v2
    routes:
      - type: rewrite
        source: /*
        destination: /index.html        # SPA routing fallback

# ── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: edupulse-db
    databaseName: edupulse_v2
    user: edupulse
    plan: free
